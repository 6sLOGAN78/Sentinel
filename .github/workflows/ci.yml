name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every step fails the job on a non-zero exit. No step masks failure (D-23).
# Action versions verified against the latest releases on 2026-10-11 and pinned
# by commit SHA (the tag is in the trailing comment).
jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go vet (integration tag)
        run: go vet -tags=integration ./...
      - name: golangci-lint
        run: go tool -modfile=tools.mod golangci-lint run ./...
      - name: golangci-lint (integration tag)
        run: go tool -modfile=tools.mod golangci-lint run --build-tags=integration ./...
      - name: go mod tidy is clean
        run: go mod tidy -diff
      - name: unit tests with race detector
        run: go test -race ./...
      - name: defect-fix tests must not silently disappear
        run: ../scripts/go-test-nonempty.sh './internal/...' 'TestRecover|TestShutdown|TestRedis|TestDSN|TestConnString|TestDotenv|TestClose'

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest

  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: JSON Schema, fixtures, dedupe key and OpenAPI tests (must match at least one test)
        working-directory: backend
        run: ../scripts/go-test-nonempty.sh './internal/contracts/... ./test/...' 'TestSchema|TestFixture|TestSkew|TestAlert|TestDedupeKey|FuzzDedupeKey|TestOpenAPI'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: generated API types compile
        working-directory: web
        run: npm ci && npm run typecheck

  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-pins.sh
      - run: scripts/check-adrs.sh

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install pinned gitleaks with checksum verification
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" "${base}/${archive}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" gitleaks
      - name: scan full history
        run: ./gitleaks git --redact --no-banner -v

  # Integration tests (Testcontainers: Kafka, ClickHouse, PostgreSQL, Redis) run on
  # every push. They hold the binary lifecycle, migration and Redis evidence cited in
  # 01-SECURITY.md. ubuntu-24.04 runners ship Docker; the job is bounded by the
  # job timeout and by `go test -timeout` inside `make test-integ`.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: integration tests
        run: make test-integ

  # Optional until Phase 6 (deployment): a real Compose smoke test of the dev stack.
  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: make dev-up
      - run: scripts/check-stack.sh
      - run: make migrate
      - name: tear down
        if: always()
        run: make dev-down
