name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every step fails the job on a non-zero exit. No step masks failure (D-23).
# Action versions verified against the latest releases on 2026-10-11 and pinned
# by commit SHA (the tag is in the trailing comment).
jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go vet (integration tag)
        run: go vet -tags=integration ./...
      - name: default workers exclude integration fault controls
        run: |
          set -euo pipefail
          files="$(go list -f '{{.GoFiles}} {{.TestGoFiles}}' ./internal/detector ./internal/eventwriter ./internal/alertwriter)"
          case "$files" in
            *failpoint_integration.go*) echo 'integration hook in default build' >&2; exit 1 ;;
          esac
      - name: golangci-lint
        run: go tool -modfile=tools.mod golangci-lint run ./...
      - name: golangci-lint (integration tag)
        run: go tool -modfile=tools.mod golangci-lint run --build-tags=integration ./...
      - name: go mod tidy is clean
        run: go mod tidy -diff
      - name: prohibited modules are absent
        run: ../scripts/check-go-dependencies.sh
      - name: dependency guard regressions
        working-directory: .
        run: python3 -B -m unittest discover -s scripts -p test_go_dependencies.py
      - name: unit tests with race detector
        run: go test -race ./...
      - name: defect-fix tests must not silently disappear
        run: ../scripts/go-test-nonempty.sh './internal/...' 'TestRecover|TestShutdown|TestRedis|TestDSN|TestConnString|TestDotenv|TestClose'

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - name: seed orchestration tests
        working-directory: .
        run: python3 -B -m unittest discover -s scripts -p test_seed.py
      - name: scenario orchestration tests
        working-directory: .
        run: generator/.venv/bin/python -B -m unittest discover -s scripts -p test_seed_scenarios.py
      - name: phase 3 selector and CI guards
        working-directory: .
        run: python3 -B -m unittest discover -s scripts -p test_phase3_guards.py
      - name: five application stack configuration guards
        working-directory: .
        run: python3 -B -m unittest discover -s scripts -p test_stack_config.py

  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: JSON Schema, fixtures, dedupe key and OpenAPI tests (must match at least one test)
        working-directory: backend
        run: ../scripts/go-test-nonempty.sh './internal/contracts/... ./test/...' 'TestSchema|TestFixture|TestSkew|TestAlert|TestDedupeKey|FuzzDedupeKey|TestOpenAPI'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: generated API types compile
        working-directory: web
        run: npm ci && npm run typecheck

  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-pins.sh
      - run: scripts/check-adrs.sh
      - run: scripts/check-makefile-dotenv.sh
      - name: Docker context hygiene regressions
        run: python3 -B -m unittest discover -s scripts -p test_docker_context.py
      - name: Docker context excludes private material
        run: python3 -B scripts/check-docker-context.py

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install pinned gitleaks with checksum verification
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" "${base}/${archive}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" gitleaks
      - name: scan full history
        run: ./gitleaks git --redact --no-banner -v

  # Integration tests (Testcontainers: Kafka, ClickHouse, PostgreSQL, Redis) run on
  # every push. They hold the binary lifecycle, migration and Redis evidence cited in
  # 01-SECURITY.md. ubuntu-24.04 runners ship Docker; the job is bounded by the
  # job timeout and by `go test -timeout` inside `make test-integ`.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: preserved scenario stack prerequisites
        run: make dev-up && scripts/check-stack.sh
      - name: integration tests
        run: make test-integ
      - name: API key integration group is nonempty
        run: scripts/go-test-nonempty.sh './test/...' 'TestKeyctl|TestIngestAuth' -tags=integration -timeout 4m -p 1
      - name: ingest integration group is nonempty
        run: scripts/go-test-nonempty.sh './test/...' 'TestIngest' -tags=integration -timeout 6m -p 1
      - name: dedupe schema and TTL integration group is nonempty
        run: scripts/go-test-nonempty.sh './test/...' 'TestDedupe|TestEventLookupTenantScope|TestEventsSchema|TestEventsTTLConfigurable' -tags=integration -timeout 4m -p 1
      - name: writer and DLQ integration group is nonempty
        run: scripts/go-test-nonempty.sh './test/...' 'TestWriterCommitAfterInsert|TestWriterPoisonToDLQ|TestWriterDLQFailureNoCommit|TestWriterFailureExitsNonzero|TestWriterSlowPoisonRebalance' -tags=integration -timeout 5m -p 1
      - name: recovery integration group is nonempty
        run: scripts/go-test-nonempty.sh './test/...' 'TestWriterCrashRestart|TestIngestRetryNoDuplicates|TestIngestKafkaTimeout503' -tags=integration -timeout 6m -p 1
      - name: rate limit integration group is nonempty
        run: scripts/go-test-nonempty.sh './test/...' 'TestRateLimit' -tags=integration -timeout 4m -p 1
      - name: readiness integration group is nonempty
        run: scripts/go-test-nonempty.sh './test/...' 'TestReadyz|TestHealthz|TestBinaryLifecycle' -tags=integration -timeout 5m -p 1
      - name: causal recovery contracts are named explicitly
        working-directory: backend
        run: |
          set -euo pipefail
          for test_name in TestWriterCrashRestart TestIngestRetryNoDuplicates TestIngestKafkaTimeout503 TestWriterSlowPoisonRebalance; do
            grep -Rqs "^func ${test_name}(" test/ || {
              echo "missing causal test: ${test_name}" >&2
              exit 1
            }
          done
      - name: tear down
        if: always()
        run: make dev-down

  # Independent selectors each prove a named PASS. Keep the full suite and all
  # Phase 2 groups above; separate jobs avoid overlapping producers/groups.
  phase3:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: make dev-up
      - run: scripts/check-stack.sh
      - name: independently nonempty Phase 3 families
        run: bash scripts/check-phase3-tests.sh
      - name: tear down
        if: always()
        run: make dev-down

  # Preserved-volume legacy seed followed by two exact scheduled scenario runs.
  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: make dev-up
      - run: scripts/check-stack.sh
      - run: make migrate
      - name: legacy seed and two preserved scenario commands
        run: timeout 32m scripts/go-test-nonempty.sh './test/...' '^TestDetectionScenariosPreservedRepeat$' -tags=integration -timeout 32m -p 1
      - name: tear down
        if: always()
        run: make dev-down
