[project]
name = "sentinel-generator"
version = "0.1.0"
description = "Seeded synthetic security event generator for Sentinel"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# The seeded random.Random is deliberately non-cryptographic: reproducibility
# from a seed is the requirement for synthetic traffic, not unpredictability.
"src/sentinel_generator/events.py" = ["S311"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
