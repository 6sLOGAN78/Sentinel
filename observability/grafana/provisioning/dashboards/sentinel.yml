# Grafana dashboard provisioning (05-13). The overlay mounts
# observability/grafana/dashboards read-only at /var/lib/grafana/dashboards.
# UI edits cannot be saved back; change the JSON in the repository instead.
apiVersion: 1

providers:
  - name: sentinel
    orgId: 1
    folder: Sentinel
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
