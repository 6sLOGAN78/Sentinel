# Phase 4 acceptance proxy (nginx template; pinned image, see
# deployments/compose/phase4-acceptance.yml). The nginx image runs envsubst over
# /etc/nginx/templates/*.template and, because NGINX_ENVSUBST_FILTER=PHASE4_,
# substitutes ONLY the PHASE4_* names below; every nginx $variable stays intact.
#
#   PHASE4_SSE_BUFFERING  "proxy_buffering off;" for the real proxy.
#   PHASE4_SSE_UPSTREAM   HTTP/1.1 keep-alive towards the replicas for the real
#                         proxy. The negative control substitutes buffering on,
#                         ignores the backend's X-Accel-Buffering hint and talks
#                         HTTP/1.0 (close-delimited, unchunked) to the replica:
#                         the classic configuration under which nginx holds
#                         small SSE frames. The acceptance test requires the
#                         real proxy to deliver the first frame within 5s and
#                         this control to miss that deadline.
#
# Trust model: the query API derives tenant and role from the verified bearer
# token only. The proxy therefore (1) forwards Authorization untouched,
# (2) overwrites X-Forwarded-For with the TCP peer instead of appending the
# client's value, (3) blanks identity-looking headers and (4) grants no CORS
# origin: the dashboard and API share this single origin.

# Docker's embedded DNS; short validity so a restarted replica is found again.
resolver 127.0.0.11 valid=2s ipv6=off;

# Spread requests over both query replicas; a replica that is stopped, or that
# fails to resolve or connect, falls through to the other one (@phase4_secondary).
split_clients $request_id $phase4_primary {
    50%  query-api;
    *    query-api-b;
}
map $phase4_primary $phase4_secondary {
    query-api  query-api-b;
    default    query-api;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    # PATCH bodies are capped at 4096 bytes by the API; keep a small margin.
    client_max_body_size 8k;

    location = /__proxy_ready {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Live alert stream: no proxy buffering, read timeout above the 15s heartbeat.
    location = /api/v1/alerts/stream {
        set $phase4_replica $phase4_primary;
        proxy_pass http://$phase4_replica:8081;
        ${PHASE4_SSE_BUFFERING}
        proxy_cache off;
        gzip off;
        ${PHASE4_SSE_UPSTREAM}
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Tenant-ID "";
        proxy_set_header X-Tenant "";
        proxy_set_header X-Role "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 45s;
        add_header X-Phase4-Replica $phase4_replica always;
        error_page 502 = @phase4_stream_secondary;
    }

    location @phase4_stream_secondary {
        set $phase4_replica $phase4_secondary;
        proxy_pass http://$phase4_replica:8081$request_uri;
        ${PHASE4_SSE_BUFFERING}
        proxy_cache off;
        gzip off;
        ${PHASE4_SSE_UPSTREAM}
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Tenant-ID "";
        proxy_set_header X-Tenant "";
        proxy_set_header X-Role "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 45s;
        add_header X-Phase4-Replica $phase4_replica always;
    }

    location /api/ {
        set $phase4_replica $phase4_primary;
        proxy_pass http://$phase4_replica:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Tenant-ID "";
        proxy_set_header X-Tenant "";
        proxy_set_header X-Role "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        add_header X-Phase4-Replica $phase4_replica always;
        error_page 502 = @phase4_api_secondary;
    }

    location @phase4_api_secondary {
        set $phase4_replica $phase4_secondary;
        proxy_pass http://$phase4_replica:8081$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Tenant-ID "";
        proxy_set_header X-Tenant "";
        proxy_set_header X-Role "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        add_header X-Phase4-Replica $phase4_replica always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Single-page application: built assets, client routes fall back to index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy no-referrer always;
    }
}
